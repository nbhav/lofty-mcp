[project]
name = "lofty-mcp"
version = "0.1.0"
description = "MCP server exposing the Lofty CRM REST API as tools for Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Transitive deps of mcp[server], but server.py's HTTP-mode auth gate imports
    # them directly (to wrap the Starlette app in a bearer-token check before
    # handing off to uvicorn), so they're declared explicitly rather than relying
    # on mcp's own requirements to keep providing them.
    "anyio>=4.9",
    "uvicorn>=0.31.1",
    "starlette>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lofty_mcp"]
