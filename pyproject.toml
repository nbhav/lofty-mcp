[project]
name = "lofty-mcp"
version = "0.1.0"
description = "MCP server exposing the Lofty CRM REST API as tools for Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lofty_mcp"]
